<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>SASjs React Seed App - a React app talking to SAS</title>

    <!-- what a search engine and a link preview read -->
    <meta
      name="description"
      content="A low-maintenance React seed app for SASjs: three SAS services, a file upload and a SAS logs panel that marks errors, warnings and notable notes - with a browser-hosted backend, so it runs without a SAS server."
    />
    <meta name="theme-color" content="#1b1b1b" />
    <link rel="canonical" href="https://sasjs.github.io/react-seed-app/" />

    <!-- Open Graph: LinkedIn, Slack, Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SASjs" />
    <meta property="og:title" content="SASjs React Seed App" />
    <meta
      property="og:description"
      content="React + @sasjs/adapter, talking to SAS through services, uploads and SAS logs. Ships with a browser-hosted backend, so it runs without a SAS server."
    />
    <meta property="og:url" content="https://sasjs.github.io/react-seed-app/" />

    <!-- Twitter / X uses these, and falls back to Open Graph -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SASjs React Seed App" />
    <meta
      name="twitter:description"
      content="React + @sasjs/adapter, talking to SAS through services, uploads and SAS logs."
    />

    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="logo192.png" />
    <link rel="manifest" href="manifest.json" />

    <!--
      The theme is applied before the first paint: a stored choice, else what the
      operating system prefers. Without this the page renders light and then
      switches, which is the flash every themed site is asked about.
    -->
    <script src="theme-init.js"></script>

    <!--
      The adapter reads this element at start-up. It is the documented way to
      configure a SASjs app, and the sasjs CLI rewrites it per target: `sasjs
      build -t mock` turns the app into one that talks to its browser-hosted
      backend, which is what makes the published demo work without a server.

      * appLoc: the folder in metadata or SAS Drive where the services live
      * serverType: SAS9, SASVIYA or SASJS
      * serverUrl: only when the frontend is not served from the SAS domain
      * loginMechanism: Default for user/password, Redirected for SSO
      * debug: capture a log for every request, for the SAS Logs panel
      * useComputeApi / contextName: Viya only
    -->
    <sasjs
      appLoc="/Public/app/react-seed-app"
      serverType="SASJS"
      debug="true"
    ></sasjs>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div id="root"></div>
  </body>
</html>
