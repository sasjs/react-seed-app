name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      # Use the MIT-licensed CLI directly; gitleaks-action requires an
      # organization license. Verify the pinned Linux x64 release before use.
      - name: Install Gitleaks v8.30.1
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan committed history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --exit-code 1 .'

  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # public/docs is a submodule (the SASjs documentation site): without it
          # the build copies an empty folder and the Documentation link is dead
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Production audit gates every severity. It does not cover advisories
      # affecting development dependencies and the build environment.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: Check code style
        run: npm run lint

      # the log summary, the abort payload and the timestamp formatting are pure
      # functions, so their specs run in node with no browser
      - name: Unit tests
        run: npm test

      - name: Build the frontend
        run: npm run build

      - name: JS getdata service tests
        run: npm run test:getdata

      # the mock's dataset is derived from serviceinit.sas; this fails when the
      # two have drifted apart
      - name: Check the mock dataset
        run: npm run check:data

      - name: Build the mock site
        run: npm run mock:build

      # a build that produces files is not a site that answers: this boots the
      # worker it ships and calls the services the app calls
      - name: Check the mock site answers
        run: npm run test:mock
