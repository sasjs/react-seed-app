name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # public/docs is a submodule (the SASjs documentation site): without it
          # the build copies an empty folder and the Documentation link is dead
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # production dependencies only: the dev toolchain's advisories do not ship
      # to a user, and gating on them makes the build fail for reasons the app
      # cannot fix
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check code style
        run: npm run lint

      # the log summary, the abort payload and the timestamp formatting are pure
      # functions, so their specs run in node with no browser
      - name: Unit tests
        run: npm test

      - name: Build the frontend
        run: npm run build

      # the mock's dataset is derived from serviceinit.sas; this fails when the
      # two have drifted apart
      - name: Check the mock dataset
        run: npm run check:data

      - name: Build the mock site
        run: npm run mock:build

      # a build that produces files is not a site that answers: this boots the
      # worker it ships and calls the services the app calls
      - name: Check the mock site answers
        run: npm run test:mock
